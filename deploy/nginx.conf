server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 38.92.15.50;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://38.92.15.50$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 38.92.15.50;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/38.92.15.50/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/38.92.15.50/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /opt/signal-monitor/current/dist;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        gzip on;
        gzip_types application/json;
        gzip_comp_level 3;
        gzip_min_length 1024;
        gzip_vary on;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host 38.92.15.50;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ^~ /assets/ {
        root /opt/signal-monitor/static;
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
